services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      POSTGRES_DB: smart_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 15

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      POSTGRES_DB: smart_home_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata: