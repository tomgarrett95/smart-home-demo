services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      POSTGRES_DB: smart_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      POSTGRES_DB: smart_home_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata: